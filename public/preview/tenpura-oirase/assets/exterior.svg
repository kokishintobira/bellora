<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="店舗外観のイメージイラスト">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20242c"/><stop offset="60%" stop-color="#39302c"/><stop offset="100%" stop-color="#5a4436"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a382a"/><stop offset="100%" stop-color="#33261c"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd79a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd79a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- 遠景の山（八甲田） -->
  <path d="M0 300 L 130 214 L 210 268 L 300 196 L 420 292 L 520 240 L 640 300 L 800 244 L 800 360 L 0 360 Z" fill="#2b2a2e" opacity="0.75"/>
  <path d="M300 196 L 340 228 L 300 236 L 262 226 Z" fill="#7d7f86" opacity="0.5"/>

  <!-- 地面 -->
  <rect y="446" width="800" height="154" fill="#241d18"/>
  <rect y="446" width="800" height="14" fill="#312721"/>

  <!-- 建物本体 -->
  <g>
    <rect x="96" y="286" width="608" height="164" fill="#3d2f24"/>
    <rect x="96" y="286" width="608" height="164" fill="url(#wood)"/>
    <!-- 屋根 -->
    <path d="M60 292 L 400 186 L 740 292 Z" fill="#2a2320"/>
    <path d="M60 292 L 400 186 L 740 292 L 740 308 L 60 308 Z" fill="#231d1a"/>
    <g stroke="#3a312c" stroke-width="2" opacity="0.8">
      <path d="M140 292 L 400 210"/><path d="M220 292 L 400 236"/><path d="M300 292 L 400 262"/>
      <path d="M660 292 L 400 210"/><path d="M580 292 L 400 236"/><path d="M500 292 L 400 262"/>
    </g>
    <!-- 軒 -->
    <rect x="72" y="306" width="656" height="12" fill="#4b3a2c"/>

    <!-- 格子窓 左 -->
    <g>
      <rect x="130" y="336" width="184" height="98" fill="#f0cf8e" opacity="0.9"/>
      <rect x="130" y="336" width="184" height="98" fill="#e5bd72" opacity="0.35"/>
      <g stroke="#4a3828" stroke-width="6">
        <path d="M130 336 H 314 M130 434 H 314 M130 336 V 434 M314 336 V 434"/>
        <path d="M191 336 V 434 M253 336 V 434 M130 369 H 314 M130 401 H 314"/>
      </g>
      <!-- 人影 -->
      <g fill="#8a6636" opacity="0.5"><circle cx="176" cy="392" r="13"/><rect x="164" y="404" width="24" height="30" rx="8"/>
        <circle cx="266" cy="398" r="11"/><rect x="256" y="408" width="21" height="26" rx="7"/></g>
    </g>
    <!-- 格子窓 右 -->
    <g>
      <rect x="486" y="336" width="184" height="98" fill="#f0cf8e" opacity="0.9"/>
      <rect x="486" y="336" width="184" height="98" fill="#e5bd72" opacity="0.35"/>
      <g stroke="#4a3828" stroke-width="6">
        <path d="M486 336 H 670 M486 434 H 670 M486 336 V 434 M670 336 V 434"/>
        <path d="M547 336 V 434 M609 336 V 434 M486 369 H 670 M486 401 H 670"/>
      </g>
    </g>

    <!-- 入口 -->
    <rect x="330" y="330" width="140" height="120" fill="#1d1713"/>
    <rect x="336" y="336" width="128" height="114" fill="#2b241d"/>
    <rect x="398" y="336" width="4" height="114" fill="#4a3828"/>
    <!-- 暖簾 -->
    <g>
      <rect x="316" y="322" width="168" height="8" rx="4" fill="#5a4632"/>
      <path d="M320 330 H 480 V 404 H 320 Z" fill="#20252e"/>
      <path d="M320 330 H 480 V 404 H 320 Z" fill="#1b2029"/>
      <rect x="374" y="336" width="6" height="68" fill="#0f1319" opacity="0.6"/>
      <rect x="420" y="336" width="6" height="68" fill="#0f1319" opacity="0.6"/>
      <g fill="#cbbfa6" opacity="0.55">
        <circle cx="400" cy="358" r="17"/>
        <path d="M400 342 L 408 358 L 400 374 L 392 358 Z" fill="#20252e"/>
      </g>
    </g>
  </g>

  <!-- 行灯 -->
  <g transform="translate(742 348)">
    <circle cx="0" cy="40" r="120" fill="url(#lamp)"/>
    <rect x="-30" y="-6" width="60" height="96" rx="8" fill="#f2d79b"/>
    <rect x="-30" y="-6" width="60" height="96" rx="8" fill="none" stroke="#5a4632" stroke-width="5"/>
    <g stroke="#5a4632" stroke-width="3"><path d="M-30 24 H 30"/><path d="M-30 56 H 30"/></g>
    <text x="0" y="26" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="22" fill="#8f2f24">天</text>
    <text x="0" y="58" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="22" fill="#8f2f24">丼</text>
    <rect x="-6" y="90" width="12" height="58" fill="#33271e"/>
  </g>

  <!-- 立て看板 -->
  <g transform="translate(112 396)">
    <rect x="-46" y="-30" width="92" height="70" rx="4" fill="#e9dfc6"/>
    <rect x="-46" y="-30" width="92" height="70" rx="4" fill="none" stroke="#4a3828" stroke-width="4"/>
    <g fill="#3a2f24" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="17" text-anchor="middle">
      <text x="0" y="-8">お食事</text><text x="0" y="14">処</text><text x="0" y="34" font-size="13" fill="#8f2f24">営業中</text>
    </g>
    <path d="M-30 40 L -22 66 M 30 40 L 22 66" stroke="#3a2f24" stroke-width="6"/>
  </g>

  <!-- 光のにじみ -->
  <ellipse cx="400" cy="446" rx="330" ry="46" fill="#ffcf8a" opacity="0.10"/>
</svg>
