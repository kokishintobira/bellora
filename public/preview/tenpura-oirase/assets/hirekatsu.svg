<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="ヒレカツ定食のイメージイラスト">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2ece0"/><stop offset="100%" stop-color="#ded2bc"/>
    </linearGradient>
    <linearGradient id="panko" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#e6a558"/><stop offset="100%" stop-color="#b9762f"/>
    </linearGradient>
    <radialGradient id="vig4" cx="0.5" cy="0.45" r="0.78">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#3a2f22" stop-opacity="0.26"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg4)"/>
  <g opacity="0.12" stroke="#8a7355" stroke-width="1">
    <path d="M20 160 C 240 130, 480 200, 780 150"/>
    <path d="M20 400 C 260 370, 520 440, 780 390"/>
  </g>

  <!-- 皿 -->
  <g transform="translate(400 320)">
    <ellipse cx="0" cy="24" rx="300" ry="150" fill="#000" opacity="0.13"/>
    <ellipse cx="0" cy="0" rx="300" ry="150" fill="#f6f2e8"/>
    <ellipse cx="0" cy="-6" rx="272" ry="132" fill="#fffdf7"/>
    <ellipse cx="0" cy="0" rx="300" ry="150" fill="none" stroke="#ddd2bd" stroke-width="3"/>
  </g>

  <!-- キャベツ -->
  <g transform="translate(556 300)">
    <path d="M-110 40 C -120 -40, -30 -76, 60 -60 C 130 -48, 140 30, 90 62 C 30 96, -90 92, -110 40 Z" fill="#dfe8cf"/>
    <g stroke="#b7c8a0" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <path d="M-84 20 C -50 -18, 20 -34, 76 -26"/>
      <path d="M-88 42 C -46 4, 24 -12, 92 0"/>
      <path d="M-70 62 C -30 26, 34 12, 100 24"/>
      <path d="M-40 76 C 0 46, 50 34, 106 44"/>
    </g>
    <g fill="#c9dab4" opacity="0.7"><ellipse cx="-20" cy="-30" rx="40" ry="14"/><ellipse cx="40" cy="10" rx="34" ry="12"/></g>
    <!-- トマト -->
    <g transform="translate(90 70)">
      <path d="M0 -30 A 30 30 0 0 1 0 30 Z" fill="#cf4636"/>
      <path d="M0 -24 A 24 24 0 0 1 0 24 Z" fill="#e0715c"/>
    </g>
  </g>

  <!-- ヒレカツ 4切れ -->
  <g transform="translate(268 300)">
    <g transform="translate(-70 -60) rotate(-8)">
      <ellipse cx="0" cy="0" rx="66" ry="46" fill="url(#panko)"/>
      <ellipse cx="0" cy="-2" rx="52" ry="33" fill="#e8ded0"/>
      <ellipse cx="0" cy="-2" rx="46" ry="28" fill="#cfa898"/>
      <g fill="#f0bd7a" opacity="0.85"><circle cx="-46" cy="10" r="7"/><circle cx="0" cy="34" r="7"/><circle cx="46" cy="6" r="7"/><circle cx="-30" cy="-32" r="6"/><circle cx="34" cy="-30" r="6"/></g>
    </g>
    <g transform="translate(6 -30) rotate(6)">
      <ellipse cx="0" cy="0" rx="66" ry="46" fill="url(#panko)"/>
      <ellipse cx="0" cy="-2" rx="52" ry="33" fill="#e8ded0"/>
      <ellipse cx="0" cy="-2" rx="46" ry="28" fill="#cfa898"/>
      <g fill="#f0bd7a" opacity="0.85"><circle cx="-46" cy="10" r="7"/><circle cx="0" cy="34" r="7"/><circle cx="46" cy="6" r="7"/></g>
    </g>
    <g transform="translate(-58 44) rotate(4)">
      <ellipse cx="0" cy="0" rx="66" ry="46" fill="url(#panko)"/>
      <ellipse cx="0" cy="-2" rx="52" ry="33" fill="#e8ded0"/>
      <ellipse cx="0" cy="-2" rx="46" ry="28" fill="#cfa898"/>
      <g fill="#f0bd7a" opacity="0.85"><circle cx="-46" cy="10" r="7"/><circle cx="0" cy="34" r="7"/><circle cx="46" cy="6" r="7"/></g>
    </g>
    <g transform="translate(24 74) rotate(-6)">
      <ellipse cx="0" cy="0" rx="66" ry="46" fill="url(#panko)"/>
      <ellipse cx="0" cy="-2" rx="52" ry="33" fill="#e8ded0"/>
      <ellipse cx="0" cy="-2" rx="46" ry="28" fill="#cfa898"/>
      <g fill="#f0bd7a" opacity="0.85"><circle cx="-46" cy="10" r="7"/><circle cx="0" cy="34" r="7"/><circle cx="46" cy="6" r="7"/></g>
    </g>
  </g>

  <!-- レモン -->
  <g transform="translate(392 396)">
    <path d="M-34 0 A 34 34 0 0 1 34 0 Z" fill="#e8c74a"/>
    <path d="M-28 -2 A 28 28 0 0 1 28 -2 Z" fill="#f4e28c"/>
    <g stroke="#e0c964" stroke-width="3"><path d="M0 -2 L 0 -28"/><path d="M0 -2 L -20 -20"/><path d="M0 -2 L 20 -20"/></g>
  </g>

  <!-- ソース差し -->
  <g transform="translate(690 470)">
    <ellipse cx="0" cy="52" rx="46" ry="14" fill="#000" opacity="0.12"/>
    <path d="M-32 -30 C -34 26, -24 48, 0 48 C 24 48, 34 26, 32 -30 Z" fill="#4a3a2c"/>
    <rect x="-20" y="-52" width="40" height="24" rx="6" fill="#6d5844"/>
    <path d="M-14 -52 L -6 -74 L 6 -74 L 14 -52 Z" fill="#6d5844"/>
  </g>

  <rect width="800" height="600" fill="url(#vig4)"/>
</svg>
