<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="天ぷら盛り合わせのイメージイラスト">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efe7d8"/>
      <stop offset="100%" stop-color="#ddd0bb"/>
    </linearGradient>
    <linearGradient id="koromo" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#f0c98a"/>
      <stop offset="100%" stop-color="#c99552"/>
    </linearGradient>
    <linearGradient id="koromo2" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#eec288"/>
      <stop offset="100%" stop-color="#bd8a48"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3a2f22" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- 和紙の繊維風テクスチャ -->
  <g opacity="0.14" stroke="#8a7355" stroke-width="1">
    <path d="M40 90 C 200 60, 420 130, 760 80"/>
    <path d="M20 210 C 260 180, 500 250, 780 200"/>
    <path d="M30 380 C 240 350, 520 420, 770 360"/>
    <path d="M50 510 C 280 480, 500 540, 760 500"/>
  </g>

  <!-- 敷紙 -->
  <g transform="translate(400 330)">
    <rect x="-290" y="-150" width="580" height="330" rx="6" fill="#fbf7ee" transform="rotate(-1.5)"/>
    <rect x="-290" y="-150" width="580" height="330" rx="6" fill="none" stroke="#e2d7c2" transform="rotate(-1.5)"/>
  </g>

  <!-- 竹ざる -->
  <g transform="translate(400 350)">
    <ellipse cx="0" cy="14" rx="252" ry="92" fill="#2b2622" opacity="0.13"/>
    <ellipse cx="0" cy="0" rx="250" ry="92" fill="#c9a978"/>
    <ellipse cx="0" cy="-8" rx="250" ry="92" fill="#e2c79b"/>
    <ellipse cx="0" cy="-8" rx="228" ry="80" fill="#d8b985"/>
    <g stroke="#c0a06e" stroke-width="3" opacity="0.85">
      <path d="M-224 -20 C -120 -60, 120 -60, 224 -20"/>
      <path d="M-228 2 C -120 -34, 120 -34, 228 2"/>
      <path d="M-220 24 C -120 -8, 120 -8, 220 24"/>
    </g>
    <ellipse cx="0" cy="-8" rx="250" ry="92" fill="none" stroke="#a98a5c" stroke-width="6"/>
  </g>

  <!-- 海老天 1 -->
  <g transform="translate(292 262) rotate(-16)">
    <path d="M-118 6 C -96 -30, -40 -40, 18 -30 C 74 -20, 110 -6, 122 8 C 108 30, 60 42, 4 40 C -52 38, -100 30, -118 6 Z" fill="url(#koromo)"/>
    <path d="M-104 4 C -80 -22, -30 -30, 20 -22 C 66 -14, 96 -2, 106 8" fill="none" stroke="#f6dcae" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
    <g fill="#e6b978">
      <circle cx="-70" cy="16" r="9"/><circle cx="-24" cy="26" r="7"/><circle cx="34" cy="24" r="9"/><circle cx="82" cy="14" r="7"/>
      <circle cx="-48" cy="-14" r="6"/><circle cx="56" cy="-8" r="6"/>
    </g>
    <path d="M122 8 L 178 -22 L 172 10 L 186 34 L 128 20 Z" fill="#e0654e"/>
    <path d="M122 8 L 178 -22 L 172 10" fill="none" stroke="#b23a2f" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- 海老天 2 -->
  <g transform="translate(470 236) rotate(8)">
    <path d="M-112 6 C -90 -28, -36 -38, 20 -28 C 72 -18, 104 -6, 116 8 C 102 28, 56 40, 2 38 C -50 36, -94 28, -112 6 Z" fill="url(#koromo2)"/>
    <path d="M-98 4 C -74 -20, -28 -28, 22 -20 C 64 -12, 92 -2, 100 8" fill="none" stroke="#f2d29e" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
    <g fill="#d9a765">
      <circle cx="-64" cy="16" r="8"/><circle cx="-18" cy="24" r="7"/><circle cx="36" cy="22" r="8"/><circle cx="78" cy="12" r="6"/>
    </g>
    <path d="M116 8 L 170 -20 L 164 10 L 178 32 L 122 20 Z" fill="#d95a44"/>
    <path d="M116 8 L 170 -20 L 164 10" fill="none" stroke="#a8332a" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- イカ天 -->
  <g transform="translate(238 350) rotate(6)">
    <rect x="-70" y="-30" width="140" height="60" rx="26" fill="url(#koromo)"/>
    <g fill="#eec288"><circle cx="-40" cy="-8" r="10"/><circle cx="2" cy="10" r="12"/><circle cx="44" cy="-6" r="10"/></g>
    <rect x="-70" y="-30" width="140" height="60" rx="26" fill="none" stroke="#b78544" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- キス天 -->
  <g transform="translate(560 352) rotate(-9)">
    <path d="M-96 0 C -70 -34, 40 -40, 96 -12 C 104 -8, 104 8, 96 12 C 40 40, -70 34, -96 0 Z" fill="url(#koromo2)"/>
    <g fill="#e9bd80"><circle cx="-50" cy="-4" r="9"/><circle cx="6" cy="6" r="10"/><circle cx="54" cy="-4" r="8"/></g>
  </g>

  <!-- 椎茸天 -->
  <g transform="translate(392 400)">
    <path d="M-64 8 C -60 -34, 60 -34, 64 8 C 40 24, -40 24, -64 8 Z" fill="url(#koromo)"/>
    <path d="M-30 8 L -30 34 L 30 34 L 30 8 Z" fill="#e3c08a"/>
    <path d="M-40 -6 C -20 -18, 20 -18, 40 -6" fill="none" stroke="#c08f4d" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- 大葉天 -->
  <g transform="translate(660 300) rotate(18)">
    <path d="M0 -58 C 52 -40, 62 20, 0 58 C -62 20, -52 -40, 0 -58 Z" fill="#8aa763"/>
    <path d="M0 -58 C 46 -38, 54 18, 0 54 C -6 18, -6 -22, 0 -58 Z" fill="#6f8b4f"/>
    <path d="M0 -50 L 0 50" stroke="#546d3a" stroke-width="3"/>
    <path d="M-56 26 C -20 46, 30 46, 58 22 C 40 56, -40 58, -56 26 Z" fill="#e8c288" opacity="0.9"/>
  </g>

  <!-- 天つゆと塩 -->
  <g transform="translate(160 470)">
    <ellipse cx="0" cy="6" rx="62" ry="24" fill="#2b2622" opacity="0.12"/>
    <ellipse cx="0" cy="0" rx="60" ry="24" fill="#3a3330"/>
    <ellipse cx="0" cy="-3" rx="48" ry="18" fill="#5b4632"/>
  </g>
  <g transform="translate(650 470)">
    <ellipse cx="0" cy="6" rx="42" ry="17" fill="#2b2622" opacity="0.12"/>
    <ellipse cx="0" cy="0" rx="40" ry="16" fill="#efe9df"/>
    <path d="M-22 -4 C -10 -16, 10 -16, 22 -4 C 10 2, -10 2, -22 -4 Z" fill="#fff"/>
  </g>

  <rect width="800" height="600" fill="url(#vig)"/>
</svg>
