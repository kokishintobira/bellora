<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="天ぷら定食のイメージイラスト">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2ece0"/>
      <stop offset="100%" stop-color="#dfd4c0"/>
    </linearGradient>
    <linearGradient id="k1" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#f0c98a"/><stop offset="100%" stop-color="#c99552"/>
    </linearGradient>
    <radialGradient id="rice" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#ece4d6"/>
    </radialGradient>
    <radialGradient id="vig2" cx="0.5" cy="0.45" r="0.78">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3a2f22" stop-opacity="0.26"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>
  <g opacity="0.13" stroke="#8a7355" stroke-width="1">
    <path d="M20 120 C 240 90, 480 160, 780 110"/>
    <path d="M20 300 C 260 270, 520 340, 780 290"/>
    <path d="M20 480 C 260 450, 520 520, 780 470"/>
  </g>

  <!-- お盆 -->
  <g transform="translate(400 320)">
    <rect x="-330" y="-190" width="660" height="400" rx="18" fill="#2b2622" opacity="0.15" transform="translate(0 14)"/>
    <rect x="-330" y="-190" width="660" height="400" rx="18" fill="#4b3a2c"/>
    <rect x="-314" y="-176" width="628" height="372" rx="12" fill="#5d4835"/>
    <rect x="-314" y="-176" width="628" height="372" rx="12" fill="none" stroke="#7b6247" stroke-width="3"/>
  </g>

  <!-- 天ぷら皿 -->
  <g transform="translate(400 210)">
    <ellipse cx="0" cy="8" rx="250" ry="82" fill="#000" opacity="0.12"/>
    <ellipse cx="0" cy="0" rx="248" ry="80" fill="#f7f3ea"/>
    <ellipse cx="0" cy="-4" rx="228" ry="70" fill="#fffdf8"/>
    <ellipse cx="0" cy="0" rx="248" ry="80" fill="none" stroke="#d8cdb8" stroke-width="3"/>
    <!-- 敷紙 -->
    <path d="M-190 -34 L 190 -34 L 168 30 L -168 30 Z" fill="#fbf8f1" stroke="#e6dcc7"/>
    <!-- 海老天 -->
    <g transform="translate(-84 -14) rotate(-14)">
      <path d="M-84 4 C -66 -22, -22 -30, 18 -22 C 54 -14, 78 -4, 88 6 C 76 22, 40 30, 0 28 C -40 26, -70 20, -84 4 Z" fill="url(#k1)"/>
      <g fill="#e9bd80"><circle cx="-46" cy="10" r="7"/><circle cx="0" cy="16" r="8"/><circle cx="46" cy="10" r="7"/></g>
      <path d="M88 6 L 130 -16 L 126 6 L 136 24 L 94 14 Z" fill="#e0654e"/>
    </g>
    <g transform="translate(56 -22) rotate(9)">
      <path d="M-80 4 C -62 -20, -20 -28, 16 -20 C 50 -12, 72 -4, 82 6 C 70 20, 38 28, 0 26 C -38 24, -66 18, -80 4 Z" fill="url(#k1)"/>
      <g fill="#e9bd80"><circle cx="-42" cy="10" r="7"/><circle cx="2" cy="14" r="7"/><circle cx="42" cy="8" r="6"/></g>
      <path d="M82 6 L 122 -14 L 118 6 L 128 22 L 88 14 Z" fill="#d95a44"/>
    </g>
    <!-- イカ天 -->
    <g transform="translate(-160 20) rotate(4)">
      <rect x="-52" y="-22" width="104" height="44" rx="20" fill="#e8bf82"/>
      <g fill="#f0cf99"><circle cx="-26" cy="-4" r="8"/><circle cx="6" cy="6" r="9"/><circle cx="32" cy="-4" r="7"/></g>
    </g>
    <!-- 椎茸 -->
    <g transform="translate(140 24)">
      <path d="M-48 6 C -44 -24, 44 -24, 48 6 C 30 18, -30 18, -48 6 Z" fill="#dfae6c"/>
      <rect x="-20" y="6" width="40" height="18" fill="#e6bd82"/>
    </g>
    <!-- 大葉 -->
    <g transform="translate(6 26) rotate(-8)">
      <path d="M0 -34 C 34 -22, 40 12, 0 36 C -40 12, -34 -22, 0 -34 Z" fill="#7d9a58"/>
      <path d="M-34 16 C -12 30, 18 30, 34 14 C 22 38, -24 38, -34 16 Z" fill="#e8c288"/>
    </g>
