    <path d="M-96 -6 C -92 60, -60 84, 0 84 C 60 84, 92 60, 96 -6 Z" fill="#3f4a52"/>
    <path d="M-96 -6 C -92 56, -62 78, 0 78 C 62 78, 92 56, 96 -6 Z" fill="#556570"/>
    <ellipse cx="0" cy="-6" rx="96" ry="26" fill="#6b7d88"/>
    <ellipse cx="0" cy="-6" rx="86" ry="21" fill="#3f4a52"/>
    <path d="M-84 -10 C -66 -52, 66 -52, 84 -10 C 60 4, -60 4, -84 -10 Z" fill="url(#rice)"/>
  </g>

  <!-- 味噌汁 -->
  <g transform="translate(404 452)">
    <ellipse cx="0" cy="58" rx="82" ry="20" fill="#000" opacity="0.12"/>
    <path d="M-82 -4 C -78 50, -50 72, 0 72 C 50 72, 78 50, 82 -4 Z" fill="#5a2f22"/>
    <ellipse cx="0" cy="-4" rx="82" ry="22" fill="#7d4630"/>
    <ellipse cx="0" cy="-4" rx="72" ry="18" fill="#8a5a30"/>
    <g fill="#c79a53" opacity="0.85"><ellipse cx="-28" cy="-6" rx="12" ry="6"/><ellipse cx="16" cy="0" rx="14" ry="6"/><ellipse cx="40" cy="-10" rx="9" ry="4"/></g>
    <g fill="#3f6b3a" opacity="0.7"><ellipse cx="-6" cy="-12" rx="10" ry="4"/></g>
  </g>

  <!-- 小鉢（ところてん） -->
  <g transform="translate(608 440)">
    <ellipse cx="0" cy="42" rx="66" ry="18" fill="#000" opacity="0.12"/>
    <path d="M-66 -8 C -62 34, -40 52, 0 52 C 40 52, 62 34, 66 -8 Z" fill="#e8e2d5"/>
    <ellipse cx="0" cy="-8" rx="66" ry="19" fill="#f6f2e9"/>
    <ellipse cx="0" cy="-8" rx="56" ry="15" fill="#d9e3e0"/>
    <g stroke="#b9cbc6" stroke-width="4" stroke-linecap="round">
      <path d="M-34 -10 L 10 -14"/><path d="M-26 -2 L 26 -6"/><path d="M-8 -16 L 34 -10"/>
    </g>
  </g>

  <!-- 天つゆ小皿 -->
  <g transform="translate(672 300)">
    <ellipse cx="0" cy="30" rx="56" ry="16" fill="#000" opacity="0.1"/>
    <ellipse cx="0" cy="0" rx="56" ry="22" fill="#3a3330"/>
    <ellipse cx="0" cy="-2" rx="44" ry="16" fill="#5b4632"/>
    <ellipse cx="-14" cy="-4" rx="16" ry="6" fill="#e6dcc4" opacity="0.5"/>
  </g>

  <!-- 箸 -->
  <g transform="translate(400 560) rotate(-1)">
    <rect x="-160" y="-6" width="320" height="7" rx="3" fill="#2f251d"/>
    <rect x="-160" y="6" width="320" height="7" rx="3" fill="#2f251d"/>
    <rect x="120" y="-8" width="44" height="11" rx="4" fill="#a5341f"/>
    <rect x="120" y="4" width="44" height="11" rx="4" fill="#a5341f"/>
