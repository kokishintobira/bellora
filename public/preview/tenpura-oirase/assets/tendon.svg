<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="天丼のイメージイラスト">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efe7d8"/><stop offset="100%" stop-color="#d9cbb4"/>
    </linearGradient>
    <linearGradient id="k3" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#e8b872"/><stop offset="100%" stop-color="#b8823f"/>
    </linearGradient>
    <radialGradient id="vig3" cx="0.5" cy="0.45" r="0.78">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#3a2f22" stop-opacity="0.28"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)"/>
  <g opacity="0.12" stroke="#8a7355" stroke-width="1">
    <path d="M20 140 C 240 110, 480 180, 780 130"/>
    <path d="M20 340 C 260 310, 520 380, 780 330"/>
  </g>

  <!-- ランチョンマット -->
  <g transform="translate(400 330) rotate(-1)">
    <rect x="-320" y="-180" width="640" height="360" rx="10" fill="#c8b294" opacity="0.5"/>
  </g>

  <!-- 丼 -->
  <g transform="translate(400 320)">
    <ellipse cx="0" cy="170" rx="200" ry="42" fill="#000" opacity="0.15"/>
    <path d="M-210 0 C -200 120, -130 178, 0 178 C 130 178, 200 120, 210 0 Z" fill="#2f3b45"/>
    <path d="M-210 0 C -200 112, -132 168, 0 168 C 132 168, 200 112, 210 0 Z" fill="#3f505c"/>
    <g opacity="0.5" fill="#8fb0c0">
      <path d="M-150 60 C -120 96, -60 120, 0 122 C 60 120, 120 96, 150 60 C 110 118, -110 118, -150 60 Z"/>
    </g>
    <ellipse cx="0" cy="0" rx="212" ry="60" fill="#55697a"/>
    <ellipse cx="0" cy="0" rx="196" ry="52" fill="#2f3b45"/>
    <!-- ご飯 -->
    <ellipse cx="0" cy="-6" rx="184" ry="46" fill="#f3ece0"/>
    <!-- タレのかかった面 -->
    <ellipse cx="0" cy="-8" rx="176" ry="42" fill="#e8d9bf"/>
    <g fill="#a06a30" opacity="0.35">
      <ellipse cx="-90" cy="-4" rx="52" ry="14"/><ellipse cx="70" cy="6" rx="60" ry="14"/><ellipse cx="10" cy="-26" rx="70" ry="12"/>
    </g>
  </g>

  <!-- 海老天2本（丼から立ち上がる） -->
  <g transform="translate(330 250) rotate(-28)">
    <path d="M-96 6 C -76 -28, -26 -36, 20 -26 C 62 -18, 90 -6, 100 8 C 88 26, 48 36, 4 34 C -42 32, -80 24, -96 6 Z" fill="url(#k3)"/>
    <g fill="#eec288"><circle cx="-54" cy="14" r="8"/><circle cx="-4" cy="20" r="9"/><circle cx="48" cy="14" r="8"/><circle cx="-30" cy="-12" r="6"/></g>
    <path d="M100 8 L 154 -18 L 148 8 L 160 30 L 108 18 Z" fill="#e0654e"/>
    <path d="M100 8 L 154 -18 L 148 8" fill="none" stroke="#b23a2f" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g transform="translate(470 232) rotate(24) scale(-1 1)">
    <path d="M-96 6 C -76 -28, -26 -36, 20 -26 C 62 -18, 90 -6, 100 8 C 88 26, 48 36, 4 34 C -42 32, -80 24, -96 6 Z" fill="url(#k3)"/>
    <g fill="#eec288"><circle cx="-54" cy="14" r="8"/><circle cx="-4" cy="20" r="9"/><circle cx="48" cy="14" r="8"/></g>
    <path d="M100 8 L 154 -18 L 148 8 L 160 30 L 108 18 Z" fill="#d95a44"/>
  </g>

  <!-- かき揚げ／野菜天 -->
  <g transform="translate(258 316) rotate(-6)">
    <path d="M-58 4 C -54 -30, 54 -32, 58 4 C 40 22, -40 22, -58 4 Z" fill="#d9a35c"/>
    <g fill="#eec288"><circle cx="-24" cy="-6" r="9"/><circle cx="14" cy="2" r="10"/><circle cx="38" cy="-8" r="7"/></g>
  </g>
  <g transform="translate(540 322) rotate(10)">
    <path d="M0 -44 C 34 -30, 40 10, 0 40 C -40 10, -34 -30, 0 -44 Z" fill="#7d9a58"/>
    <path d="M-36 12 C -12 30, 18 30, 36 10 C 24 40, -26 40, -36 12 Z" fill="#e8c288"/>
  </g>

  <!-- 蕎麦（そば付き） -->
  <g transform="translate(690 470)">
    <ellipse cx="0" cy="30" rx="98" ry="26" fill="#000" opacity="0.12"/>
    <rect x="-96" y="-40" width="192" height="70" rx="8" fill="#5b4331"/>
    <rect x="-88" y="-34" width="176" height="58" rx="6" fill="#6d5240"/>
    <g stroke="#c8b48c" stroke-width="6" stroke-linecap="round" opacity="0.95">
      <path d="M-64 -16 C -30 -30, 30 -6, 64 -20"/>
      <path d="M-66 -2 C -30 -18, 30 6, 66 -6"/>
      <path d="M-62 12 C -28 -4, 28 18, 62 8"/>
    </g>
  </g>

  <rect width="800" height="600" fill="url(#vig3)"/>
</svg>
