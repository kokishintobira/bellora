<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>みつけてタップ！</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="top-bar" aria-label="ゲームのそうさ">
        <div>
          <p class="eyebrow">4さいからの さがしあそび</p>
          <h1>みつけてタップ！</h1>
        </div>
        <div class="mode-switch" role="tablist" aria-label="ゲームをえらぶ">
          <button class="mode-button active" type="button" data-mode="word" role="tab" aria-selected="true">
            ことば
          </button>
          <button class="mode-button" type="button" data-mode="number" role="tab" aria-selected="false">
            すうじ
          </button>
        </div>
      </section>

      <section class="status-panel" aria-live="polite">
        <div class="target-card">
          <span class="target-label">さがすもの</span>
          <strong id="targetText">らいおん</strong>
        </div>
        <div class="progress-card">
          <span id="progressText">0 / 4</span>
          <div class="stars" id="stars" aria-hidden="true"></div>
        </div>
        <button class="round-button" id="newRoundButton" type="button" aria-label="つぎのもんだい">
          ↻
        </button>
      </section>

      <section class="play-area" aria-label="さがすばしょ">
        <div class="scene" id="scene">
          <div class="scene-pattern" aria-hidden="true"></div>
          <div class="token-layer" id="tokenLayer"></div>
          <div class="finish-pop" id="finishPop" hidden>
            <strong>できた！</strong>
            <span>つぎも やってみよう</span>
          </div>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
